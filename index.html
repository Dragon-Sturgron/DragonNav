<style>

html[data-theme=dark]{--bg:#0c0d10;--panel:rgba(24,24,27,.82);--solid:#18181b;--text:#f4f4f5;--muted:#a1a1aa;--line:rgba(255,255,255,.09);--chip:#27272a;--shadow:0 18px 46px rgba(0,0,0,.28);--primary:#f4f4f5;--primaryText:#18181b;--engine-selected:#52525b;--engine-selected-text:#fff;--engine-unselected:#fff;--engine-hover:#f1f2f4}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 0,rgba(96,165,250,.14),transparent 28rem),radial-gradient(circle at 90% 15%,rgba(167,139,250,.14),transparent 30rem),var(--bg);color:var(--text);font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;transition:.2s}
button,input,select{font:inherit}.shell{width:min(1180px,calc(100% - 32px));margin:auto;padding:28px 0 58px}
.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;margin-bottom:28px}.brand{display:flex;align-items:center;gap:11px;font-size:18px;font-weight:850}.brandMark{width:39px;height:39px;border-radius:13px;display:grid;place-items:center;background:var(--primary);color:var(--primaryText);box-shadow:var(--shadow)}.actions{display:flex;gap:9px;align-items:center}.pill,.iconBtn{border:1px solid var(--line);background:var(--panel);color:var(--text);backdrop-filter:blur(18px)}.pill{padding:10px 13px;border-radius:999px;color:var(--muted);font-size:13px}.iconBtn{width:42px;height:42px;border-radius:50%;cursor:pointer}
.weatherCard{min-width:238px;max-width:320px;display:flex;align-items:center;gap:11px;padding:10px 13px;border:1px solid var(--line);border-radius:18px;background:var(--panel);backdrop-filter:blur(18px);box-shadow:0 10px 30px rgba(0,0,0,.045);cursor:pointer;transition:transform .16s,box-shadow .16s,border-color .16s}.weatherCard:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(0,0,0,.08);border-color:rgba(100,100,110,.18)}.weatherIcon{width:40px;height:40px;flex:0 0 40px;display:grid;place-items:center;border-radius:13px;background:var(--chip);font-size:23px}.weatherBody{min-width:0;flex:1;text-align:left}.weatherLocation{font-size:12px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.weatherLine{display:flex;align-items:center;gap:7px;margin-top:3px;font-size:12px;color:var(--muted);white-space:nowrap}.weatherTemp{font-size:15px;font-weight:850;color:var(--text)}.weatherSource{margin-top:2px;font-size:8px;color:var(--muted);opacity:.64;white-space:nowrap}.weatherCard[data-state="error"] .weatherIcon{font-size:18px}.weatherCard[data-state="error"] .weatherLine{white-space:normal}.weatherMore{flex:0 0 auto;color:var(--muted);font-size:13px;transition:transform .16s}.weatherCard:hover .weatherMore{transform:translateX(2px)}
.forecastBack{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(15,23,42,.38);backdrop-filter:blur(5px);opacity:0;visibility:hidden;transition:opacity .16s,visibility .16s}.forecastBack.open{opacity:1;visibility:visible}.forecastModal{width:min(760px,100%);max-height:min(82vh,720px);overflow:auto;background:var(--solid);color:var(--text);border:1px solid var(--line);border-radius:24px;box-shadow:0 28px 90px rgba(0,0,0,.24);padding:20px;transform:translateY(8px) scale(.985);transition:transform .16s}.forecastBack.open .forecastModal{transform:translateY(0) scale(1)}.forecastHead{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:17px}.forecastTitle{font-size:20px;font-weight:900;letter-spacing:-.025em}.forecastPlace{margin-top:5px;color:var(--muted);font-size:12px}.forecastActions{display:flex;gap:8px}.forecastBtn{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:11px;padding:8px 11px;cursor:pointer;font-size:12px;font-weight:750}.forecastBtn:hover{background:var(--chip)}.forecastClose{width:34px;height:34px;padding:0;border-radius:50%;font-size:18px}.forecastGrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:9px}.forecastDay{min-width:0;padding:13px 8px;border:1px solid var(--line);border-radius:16px;background:var(--panel);text-align:center}.forecastDay.today{box-shadow:inset 0 0 0 1px var(--text)}.forecastWeek{font-size:12px;font-weight:850}.forecastDate{margin-top:3px;color:var(--muted);font-size:10px}.forecastWeatherIcon{font-size:27px;margin:10px 0 6px}.forecastWeatherText{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.forecastTemps{margin-top:9px;font-size:12px;font-weight:850}.forecastLow{color:var(--muted);font-weight:650}.forecastRain{margin-top:7px;color:var(--muted);font-size:10px}.forecastLoading{grid-column:1/-1;text-align:center;padding:42px 12px;color:var(--muted);font-size:13px}.forecastFoot{margin-top:13px;text-align:right;color:var(--muted);font-size:9px}
.hero{text-align:center;max-width:830px;margin:0 auto 44px}.heroClock{display:flex;justify-content:center;margin:2px 0 22px}.clockCard{min-width:220px;padding:15px 26px 14px;border:1px solid var(--line);border-radius:22px;background:var(--panel);backdrop-filter:blur(18px);box-shadow:0 16px 42px rgba(0,0,0,.055)}.clockTime{font-size:36px;font-weight:900;line-height:1;letter-spacing:.035em;font-variant-numeric:tabular-nums}.clockDate{margin-top:7px;color:var(--muted);font-size:13px;letter-spacing:.02em}
.search{max-width:760px;margin:auto;display:flex;align-items:center;padding:7px;border:1px solid var(--line);background:var(--solid);border-radius:24px;box-shadow:0 20px 62px rgba(0,0,0,.09)}.search:focus-within{box-shadow:0 24px 72px rgba(0,0,0,.13)}
.enginePicker{position:relative;flex:0 0 auto;margin-left:1px}.engineTrigger{width:52px;height:52px;border:1px solid color-mix(in srgb,var(--engine-unselected) 76%, #cfd4dc 24%)!important;outline:0;border-radius:16px;background:var(--engine-unselected)!important;color:#18181b;display:flex;align-items:center;justify-content:center;gap:4px;cursor:pointer;transition:background .16s,border-color .16s,transform .16s,box-shadow .16s}.engineTrigger:hover{background:var(--engine-hover)!important;border-color:color-mix(in srgb,var(--engine-hover) 76%, #cfd4dc 24%)!important}.engineTrigger:active{transform:scale(.97)}.engineTrigger[aria-expanded="true"]{box-shadow:0 0 0 3px rgba(120,120,130,.10)}.engineLogo{width:28px;height:28px;border-radius:50%;background:color-mix(in srgb,var(--engine-unselected) 92%, #fff 8%);display:grid;place-items:center;overflow:hidden;flex:0 0 28px;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--engine-unselected) 80%, #d4d8df 20%),0 1px 3px rgba(0,0,0,.08)}.engineLogo img{width:19px;height:19px;object-fit:contain}.engineLogo .fallback{display:none;font-size:11px;font-weight:900;color:#71717a}.engineCaret{font-size:10px;color:var(--muted);line-height:1;transform:translateY(-1px);transition:transform .16s}.engineTrigger[aria-expanded="true"] .engineCaret{transform:translateY(-1px) rotate(180deg)}.engineMenu{position:absolute;left:0;top:calc(100% + 10px);z-index:50;width:220px;padding:7px;background:#fff;border:1px solid #e5e7eb;border-radius:16px;box-shadow:0 18px 55px rgba(0,0,0,.16);opacity:0;visibility:hidden;transform:translateY(-6px) scale(.98);transform-origin:top left;transition:opacity .14s,visibility .14s,transform .14s}.engineMenu.open{opacity:1;visibility:visible;transform:translateY(0) scale(1)}.engineOption{width:100%;border:0;background:var(--engine-unselected)!important;margin:3px 0;color:#18181b!important;display:flex;align-items:center;gap:11px;padding:10px 11px;border-radius:11px;text-align:left;cursor:pointer;transition:background .12s}.engineOption:hover{background:var(--engine-hover)!important}.engineOption.active{background:var(--engine-selected)!important;color:var(--engine-selected-text)!important;font-weight:800}.engineOptionLogo{width:27px;height:27px;flex:0 0 27px;border-radius:50%;background:#fff;display:grid;place-items:center;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.08)}.engineOptionLogo img{width:18px;height:18px;object-fit:contain}.engineOptionFallback{font-size:11px;font-weight:900;color:#71717a}.engineOptionName{min-width:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}.engineCheck{width:18px;color:var(--muted);font-size:13px;text-align:center}.engineOption.active .engineCheck{color:var(--engine-selected-text)!important}.searchDivider{width:1px;height:28px;background:var(--line);margin:0 6px 0 10px;flex:0 0 1px}
.search input{width:100%;min-width:0;padding:13px 12px;border:0;outline:0;background:transparent;color:var(--text);font-size:16px}.search button{border:0;border-radius:18px;background:var(--primary);color:var(--primaryText);padding:13px 20px;font-weight:800;cursor:pointer}
.toolbar{display:flex;align-items:end;justify-content:flex-start;gap:16px;margin:0 0 18px}.toolbar h2{margin:0 0 5px;font-size:22px}.toolbar p{margin:0;color:var(--muted);font-size:13px}
.category{margin-top:28px}.catHead{display:flex;align-items:center;gap:9px;margin-bottom:13px}.dot{width:8px;height:8px;border-radius:50%;background:var(--text);opacity:.72}.catName{font-size:14px;font-weight:850}.count{font-size:12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.siteBtn{position:relative;min-height:126px;padding:17px 10px 14px;border:1px solid var(--line);border-radius:18px;background:var(--panel);backdrop-filter:blur(18px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;text-decoration:none;color:var(--text);transition:.18s;overflow:hidden}.siteBtn:hover{transform:translateY(-4px);box-shadow:var(--shadow);border-color:rgba(110,110,120,.22)}.siteBtn:active{transform:translateY(-1px)}
.logoBox{width:50px;height:50px;border-radius:15px;background:var(--chip);display:grid;place-items:center;margin-bottom:10px;overflow:hidden}.logoBox img{width:31px;height:31px;object-fit:contain}.logoFallback{display:none;font-weight:900;font-size:15px}.siteName{width:100%;font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.siteDesc{width:100%;font-size:10px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status{display:none;text-align:center;padding:50px 20px;border:1px dashed var(--line);border-radius:18px;color:var(--muted)}.kvWarn{display:none;max-width:760px;margin:16px auto 0;padding:10px 12px;border:1px solid var(--line);border-radius:12px;color:var(--muted);font-size:12px}
footer{text-align:center;margin-top:48px;color:var(--muted);font-size:12px}
@media(max-width:1000px){.grid{grid-template-columns:repeat(5,minmax(0,1fr))}.forecastGrid{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(max-width:820px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.weatherCard{min-width:210px;max-width:245px}}@media(max-width:650px){.shell{width:calc(100% - 22px);padding-top:18px}.topbar{margin-bottom:26px;align-items:flex-start}.brand{font-size:16px}.brandMark{width:36px;height:36px}.weatherCard{min-width:0;max-width:190px;padding:8px 10px;border-radius:15px}.weatherIcon{width:34px;height:34px;flex-basis:34px;border-radius:11px;font-size:19px}.weatherLocation{font-size:11px}.weatherLine{font-size:10px;gap:4px}.weatherTemp{font-size:13px}.weatherSource{display:none}.clockCard{min-width:190px;padding:13px 22px}.clockTime{font-size:31px}.clockDate{font-size:12px}.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.toolbar{align-items:stretch;flex-direction:column}.siteBtn{min-height:116px}.hero{margin-bottom:36px}.engineTrigger{width:48px;height:48px;border-radius:14px}.engineLogo{width:26px;height:26px;flex-basis:26px}.engineMenu{width:205px}.search input{padding-left:8px}.search button{padding-left:15px;padding-right:15px}}@media(max-width:430px){.topbar{gap:10px}.brand span{display:none}.weatherCard{max-width:220px}.forecastBack{padding:10px}.forecastModal{padding:15px;border-radius:20px}.forecastGrid{grid-template-columns:repeat(2,minmax(0,1fr))}.forecastDay{padding:12px 8px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.engineTrigger{width:46px;height:46px}.engineMenu{width:195px}}
</style>
</head>
<body>
<main class="shell">
<header class="topbar">
  <div class="brand"><div class="brandMark">D</div><span id="brandText">龙鲟导航</span></div>
  <div class="weatherCard" id="weatherCard" data-state="loading" title="点击查看未来 7 天天气">
    <div class="weatherIcon" id="weatherIcon">⌖</div>
    <div class="weatherBody">
      <div class="weatherLocation" id="weatherLocation">正在获取位置…</div>
      <div class="weatherLine"><span class="weatherTemp" id="weatherTemp">--°</span><span id="weatherText">天气加载中</span><span id="weatherRange"></span></div>
      <div class="weatherSource">点击查看未来 7 天 · Open-Meteo</div>
    </div>
    <div class="weatherMore">›</div>
  </div>
</header>
<section class="hero">
  <div class="heroClock">
    <div class="clockCard">
      <div class="clockTime" id="clockTime">--:--</div>
      <div class="clockDate" id="clockDate">正在读取时间…</div>
    </div>
  </div>
  <form class="search" id="searchForm">
    <div class="enginePicker" id="enginePicker">
      <button class="engineTrigger" id="engineTrigger" type="button" aria-label="选择搜索引擎" aria-haspopup="menu" aria-expanded="false">
        <span class="engineLogo" aria-hidden="true"><img id="engineLogoImg" alt="" loading="lazy"><span class="fallback" id="engineLogoFallback"></span></span>
        <span class="engineCaret" aria-hidden="true">⌄</span>
      </button>
      <div class="engineMenu" id="engineMenu" role="menu"></div>
    </div>
    <span class="searchDivider"></span>
    <input id="searchInput" autocomplete="off" placeholder="搜索内容，或输入网址直接打开…">
    <button>搜索</button>
  </form>
  <div class="kvWarn" id="kvWarn">暂时无法读取 KV，当前显示内置默认导航。</div>
</section>
<section>
  <div class="toolbar"><div><h2>网站导航</h2><p>图标按钮形式，点击后在新标签页打开</p></div></div>
  <div id="navRoot"></div><div class="status" id="empty">没有找到匹配的网站</div>
</section>
<footer>© <span id="year"></span> <span id="footerTitle">龙鲟导航</span> · Tencent EdgeOne Makers</footer>

<div class="forecastBack" id="forecastBack" aria-hidden="true">
  <div class="forecastModal" role="dialog" aria-modal="true" aria-labelledby="forecastTitle">
    <div class="forecastHead">
      <div>
        <div class="forecastTitle" id="forecastTitle">未来 7 天天气</div>
        <div class="forecastPlace" id="forecastPlace">正在获取当前位置…</div>
      </div>
      <div class="forecastActions">
        <button class="forecastBtn" id="forecastRefresh" type="button">重新定位</button>
        <button class="forecastBtn forecastClose" id="forecastClose" type="button" aria-label="关闭">×</button>
      </div>
    </div>
    <div class="forecastGrid" id="forecastGrid"><div class="forecastLoading">正在获取未来天气…</div></div>
    <div class="forecastFoot">天气数据：Open-Meteo · 地址数据：© OpenStreetMap contributors</div>
  </div>
</div>

</main>
<script>
const DEFAULT_CONFIG={"version":3,"settings":{"title":"龙鲟导航","subtitle":"搜索一下，或者直接打开常用网站","maxSites":0,"engineColorFollowTheme":false,"engineSelectedColor":"#52525b","engineUnselectedColor":"#ffffff","engineHoverColor":"#f1f2f4"},"categories":[{"id":"ai","name":"AI 工具","enabled":true},{"id":"dev","name":"开发与代码","enabled":true},{"id":"cloud","name":"云服务与部署","enabled":true},{"id":"office","name":"日常办公","enabled":true},{"id":"media","name":"影音与社区","enabled":true},{"id":"tools","name":"实用工具","enabled":true}],"sites":[{"id":"chatgpt","name":"ChatGPT","url":"https://chatgpt.com/","desc":"OpenAI AI 助手","icon":"","categoryId":"ai","enabled":true},{"id":"deepseek","name":"DeepSeek","url":"https://chat.deepseek.com/","desc":"DeepSeek AI 助手","icon":"","categoryId":"ai","enabled":true},{"id":"yuanbao","name":"腾讯元宝","url":"https://yuanbao.tencent.com/","desc":"腾讯 AI 助手","icon":"","categoryId":"ai","enabled":true},{"id":"gemini","name":"Gemini","url":"https://gemini.google.com/","desc":"Google AI 助手","icon":"","categoryId":"ai","enabled":true},{"id":"github","name":"GitHub","url":"https://github.com/","desc":"代码托管与协作","icon":"","categoryId":"dev","enabled":true},{"id":"gitee","name":"Gitee","url":"https://gitee.com/","desc":"国内代码托管平台","icon":"","categoryId":"dev","enabled":true},{"id":"mdn","name":"MDN","url":"https://developer.mozilla.org/zh-CN/","desc":"Web 开发文档","icon":"","categoryId":"dev","enabled":true},{"id":"stackoverflow","name":"Stack Overflow","url":"https://stackoverflow.com/","desc":"开发者问答社区","icon":"","categoryId":"dev","enabled":true},{"id":"edgeone","name":"EdgeOne Makers","url":"https://pages.edgeone.ai/","desc":"Tencent EdgeOne 部署平台","icon":"","categoryId":"cloud","enabled":true},{"id":"tencentcloud","name":"腾讯云","url":"https://cloud.tencent.com/","desc":"腾讯云控制台与服务","icon":"","categoryId":"cloud","enabled":true},{"id":"cloudflare","name":"Cloudflare","url":"https://dash.cloudflare.com/","desc":"CDN、DNS 与网络服务","icon":"","categoryId":"cloud","enabled":true},{"id":"vercel","name":"Vercel","url":"https://vercel.com/","desc":"前端应用部署平台","icon":"","categoryId":"cloud","enabled":true},{"id":"docsqq","name":"腾讯文档","url":"https://docs.qq.com/","desc":"在线文档与表格","icon":"","categoryId":"office","enabled":true},{"id":"feishu","name":"飞书","url":"https://www.feishu.cn/","desc":"协同办公平台","icon":"","categoryId":"office","enabled":true},{"id":"wps","name":"WPS","url":"https://www.wps.cn/","desc":"办公软件与云文档","icon":"","categoryId":"office","enabled":true},{"id":"notion","name":"Notion","url":"https://www.notion.so/","desc":"知识库与笔记","icon":"","categoryId":"office","enabled":true},{"id":"bilibili","name":"哔哩哔哩","url":"https://www.bilibili.com/","desc":"视频与社区","icon":"","categoryId":"media","enabled":true},{"id":"youtube","name":"YouTube","url":"https://www.youtube.com/","desc":"在线视频平台","icon":"","categoryId":"media","enabled":true},{"id":"zhihu","name":"知乎","url":"https://www.zhihu.com/","desc":"中文问答社区","icon":"","categoryId":"media","enabled":true},{"id":"weibo","name":"微博","url":"https://weibo.com/","desc":"社交媒体平台","icon":"","categoryId":"media","enabled":true},{"id":"speedtest","name":"Speedtest","url":"https://www.speedtest.net/","desc":"网络速度测试","icon":"","categoryId":"tools","enabled":true},{"id":"ipsb","name":"IP 查询","url":"https://ip.sb/","desc":"查看当前公网 IP","icon":"","categoryId":"tools","enabled":true},{"id":"caniuse","name":"Can I Use","url":"https://caniuse.com/","desc":"浏览器兼容性查询","icon":"","categoryId":"tools","enabled":true},{"id":"tinypng","name":"TinyPNG","url":"https://tinypng.com/","desc":"在线图片压缩","icon":"","categoryId":"tools","enabled":true}],"searchEngines":[{"id":"bing","name":"必应","url":"https://www.bing.com/search?q={q}","icon":"https://www.bing.com/favicon.ico","enabled":true},{"id":"baidu","name":"百度","url":"https://www.baidu.com/s?wd={q}","icon":"https://www.baidu.com/favicon.ico","enabled":true},{"id":"google","name":"Google","url":"https://www.google.com/search?q={q}","icon":"https://www.google.com/favicon.ico","enabled":true},{"id":"sogou","name":"搜狗","url":"https://www.sogou.com/web?query={q}","icon":"https://www.sogou.com/favicon.ico","enabled":true},{"id":"duck","name":"DuckDuckGo","url":"https://duckduckgo.com/?q={q}","icon":"https://duckduckgo.com/favicon.ico","enabled":true}]};
let config=structuredClone(DEFAULT_CONFIG);
let engine=localStorage.getItem("nav-engine")||"";
const $=id=>document.getElementById(id);
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function safeUrl(url){try{const u=new URL(url);return ["http:","https:"].includes(u.protocol)?u.href:"#"}catch{return"#"}}
function favicon(site){if(site.icon&&/^https?:\/\//i.test(site.icon))return site.icon;try{return new URL("/favicon.ico",site.url).href}catch{return""}}
function initials(name){return(name||"?").replace(/\s+/g,"").slice(0,2).toUpperCase()}
function activeEngines(){return(config.searchEngines||[]).filter(e=>e.enabled!==false&&e.url)}
function engineIcon(item){if(item?.icon&&/^https?:\/\//i.test(item.icon))return item.icon;try{return new URL("/favicon.ico",item?.url||"").href}catch{return""}}
function setEngineLogo(item){
 const img=$("engineLogoImg"),fallback=$("engineLogoFallback"),icon=engineIcon(item);
 fallback.textContent=(item?.name||"?").trim().slice(0,1).toUpperCase()||"?";
 if(icon){img.src=icon;img.style.display="block";fallback.style.display="none";img.onerror=()=>{img.style.display="none";fallback.style.display="block"}}
 else{img.removeAttribute("src");img.style.display="none";fallback.style.display="block"}
}
function engineOptionHtml(item,isActive){
 const icon=engineIcon(item),fallback=(item?.name||"?").trim().slice(0,1).toUpperCase()||"?";
 return `<button class="engineOption${isActive?" active":""}" type="button" role="menuitem" data-engine-id="${esc(item.id)}">
   <span class="engineOptionLogo">${icon?`<img src="${esc(icon)}" alt="" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='block'">`:""}<span class="engineOptionFallback" style="${icon?"display:none":""}">${esc(fallback)}</span></span>
   <span class="engineOptionName">${esc(item.name)}</span>
   <span class="engineCheck">${isActive?"✓":""}</span>
 </button>`;
}
function closeEngineMenu(){
 $("engineMenu").classList.remove("open");
 $("engineTrigger").setAttribute("aria-expanded","false");
}
function openEngineMenu(){
 $("engineMenu").classList.add("open");
 $("engineTrigger").setAttribute("aria-expanded","true");
}
function toggleEngineMenu(){
 $("engineMenu").classList.contains("open")?closeEngineMenu():openEngineMenu();
}
function renderEngineSelect(){
 const engines=activeEngines(),menu=$("engineMenu");
 if(!engines.length){engine="";setEngineLogo(null);menu.innerHTML='<div style="padding:11px;color:var(--muted);font-size:13px">暂无可用搜索引擎</div>';return}
 if(!engines.some(e=>e.id===engine))engine=engines[0].id;
 const current=engines.find(e=>e.id===engine)||engines[0];
 setEngineLogo(current);
 menu.innerHTML=engines.map(e=>engineOptionHtml(e,e.id===engine)).join("");
 menu.querySelectorAll("[data-engine-id]").forEach(btn=>btn.onclick=()=>{
   engine=btn.dataset.engineId;
   localStorage.setItem("nav-engine",engine);
   renderEngineSelect();
   closeEngineMenu();
   $("searchInput").focus();
 });
 localStorage.setItem("nav-engine",engine);
}
$("engineTrigger").onclick=e=>{e.stopPropagation();toggleEngineMenu()};
$("engineMenu").onclick=e=>e.stopPropagation();
document.addEventListener("click",closeEngineMenu);
document.addEventListener("keydown",e=>{
 if(e.key==="Escape")closeEngineMenu();
});
function buildSearchUrl(item,q){
 const encoded=encodeURIComponent(q),tpl=String(item?.url||"");
 return tpl.includes("{q}")?tpl.split("{q}").join(encoded):tpl+encoded;
}
$("searchForm").onsubmit=e=>{
 e.preventDefault();const q=$("searchInput").value.trim();if(!q)return;
 const looks=/^(https?:\/\/)/i.test(q)||/^([a-z0-9-]+\.)+[a-z]{2,}(\/.*)?$/i.test(q)||/^localhost(:\d+)?/i.test(q);
 if(looks){window.open(/^https?:\/\//i.test(q)?q:"https://"+q,"_blank","noopener,noreferrer");return}
 const engines=activeEngines(),se=engines.find(x=>x.id===engine)||engines[0];if(!se)return;
 window.open(buildSearchUrl(se,q),"_blank","noopener,noreferrer");
};
function visibleData(keyword=""){
 const cats=(config.categories||[]).filter(x=>x.enabled!==false);
 const activeSites=(config.sites||[]).filter(x=>x.enabled!==false);
 let ordered=[];cats.forEach(cat=>{activeSites.filter(s=>s.categoryId===cat.id).forEach(s=>ordered.push(s))});
 const max=Number(config.settings?.maxSites||0);if(max>0)ordered=ordered.slice(0,max);
 const k=keyword.trim().toLowerCase();
 if(k)ordered=ordered.filter(s=>(`${s.name} ${s.desc||""} ${cats.find(c=>c.id===s.categoryId)?.name||""}`).toLowerCase().includes(k));
 return{cats,sites:ordered};
}
function renderNav(keyword=""){
 const{cats,sites}=visibleData(keyword),root=$("navRoot");root.innerHTML="";let shown=0;
 cats.forEach(cat=>{
   const list=sites.filter(s=>s.categoryId===cat.id);if(!list.length)return;shown+=list.length;
   const sec=document.createElement("div");sec.className="category";
   sec.innerHTML=`<div class="catHead"><span class="dot"></span><span class="catName">${esc(cat.name)}</span><span class="count">${list.length}</span></div><div class="grid"></div>`;
   const grid=sec.querySelector(".grid");
   list.forEach(site=>{
     const a=document.createElement("a");a.className="siteBtn";a.href=safeUrl(site.url);a.target="_blank";a.rel="noopener noreferrer";const icon=favicon(site);
     a.innerHTML=`<div class="logoBox">${icon?`<img src="${esc(icon)}" alt="" loading="lazy">`:""}<span class="logoFallback" style="${icon?"":"display:block"}">${esc(initials(site.name))}</span></div><div class="siteName">${esc(site.name)}</div><div class="siteDesc">${esc(site.desc||"点击打开")}</div>`;
     const img=a.querySelector("img");if(img)img.onerror=()=>{img.style.display="none";a.querySelector(".logoFallback").style.display="block"};grid.appendChild(a);
   });root.appendChild(sec);
 });$("empty").style.display=shown?"none":"block";
}
function applySettings(){
 const s=config.settings||{},title=s.title||"龙鲟导航";
 document.title=title;$("brandText").textContent=title;$("footerTitle").textContent=title;
 const validHex=v=>/^#[0-9a-fA-F]{6}$/.test(String(v||""));
 const selected=validHex(s.engineSelectedColor)?s.engineSelectedColor:"#52525b";
 const unselected=validHex(s.engineUnselectedColor)?s.engineUnselectedColor:"#ffffff";
 const hover=validHex(s.engineHoverColor)?s.engineHoverColor:"#f1f2f4";
 document.documentElement.style.setProperty("--engine-selected",selected);
 document.documentElement.style.setProperty("--engine-unselected",unselected);
 document.documentElement.style.setProperty("--engine-hover",hover);
}
async function loadConfig(){try{const r=await fetch("/api/config",{cache:"no-store"});if(!r.ok)throw new Error("HTTP "+r.status);const data=await r.json();if(data?.config)config=data.config}catch(err){console.warn(err);$("kvWarn").style.display="block"}applySettings();renderEngineSelect();renderNav()}
document.addEventListener("keydown",e=>{if(e.key==="/"&&document.activeElement.tagName!=="INPUT"){e.preventDefault();$("searchInput").focus()}});
const saved=localStorage.getItem("nav-theme");document.documentElement.dataset.theme=saved||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");

function clock(){
 const n=new Date();
 $("clockTime").textContent=n.toLocaleTimeString("zh-CN",{hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false});
 $("clockDate").textContent=n.toLocaleDateString("zh-CN",{year:"numeric",month:"long",day:"numeric",weekday:"long"});
}

const WEATHER_CACHE_KEY="dragonnav-weather-cache-v2";
const LOCATION_CACHE_KEY="dragonnav-location-cache-v2";
let currentWeatherData=null;

function weatherInfo(code){
 const c=Number(code);
 if(c===0)return{icon:"☀️",text:"晴"};
 if(c===1)return{icon:"🌤️",text:"大致晴朗"};
 if(c===2)return{icon:"⛅",text:"多云"};
 if(c===3)return{icon:"☁️",text:"阴"};
 if(c===45||c===48)return{icon:"🌫️",text:"雾"};
 if([51,53,55,56,57].includes(c))return{icon:"🌦️",text:"毛毛雨"};
 if([61,63,65,66,67,80,81,82].includes(c))return{icon:"🌧️",text:"雨"};
 if([71,73,75,77,85,86].includes(c))return{icon:"🌨️",text:"雪"};
 if([95,96,99].includes(c))return{icon:"⛈️",text:"雷雨"};
 return{icon:"🌡️",text:"天气"};
}
function safeCacheGet(key){
 try{return JSON.parse(localStorage.getItem(key)||"null")}catch{return null}
}
function safeCacheSet(key,value){
 try{localStorage.setItem(key,JSON.stringify(value))}catch{}
}
function uniqueParts(parts){
 const out=[];
 parts.filter(Boolean).forEach(raw=>{
   const v=String(raw).trim();
   if(!v)return;
   if(out.some(x=>x===v||x.includes(v)||v.includes(x)))return;
   out.push(v);
 });
 return out;
}
function endsLikeDistrict(v){
 return /(区|县|自治县|旗|自治旗|新区|林区|特区)$/u.test(String(v||""));
}
function endsLikeCity(v){
 return /(市|自治州|地区|盟)$/u.test(String(v||""));
}
function formatGeocodeLocation(geo){
 const g=geo||{},admin=g.admin||{};
 const adminValues=Object.entries(admin)
   .sort((a,b)=>Number(String(b[0]).replace(/\D/g,""))-Number(String(a[0]).replace(/\D/g,"")))
   .map(x=>x[1]).filter(Boolean);

 let city=g.city||admin.level6||admin.level5||"";
 let district=g.district||admin.level8||admin.level7||admin.level9||"";

 if(!district)district=adminValues.find(endsLikeDistrict)||g.county||g.locality||g.suburb||"";
 if(!city)city=adminValues.find(v=>endsLikeCity(v)&&v!==district)||"";
 if(!city&&admin.level4&&endsLikeCity(admin.level4))city=admin.level4;

 const labelParts=String(g.label||"").split(",").map(x=>x.trim()).filter(Boolean);
 if(!district)district=labelParts.find(endsLikeDistrict)||"";
 if(!city)city=labelParts.find(v=>endsLikeCity(v)&&v!==district)||"";

 const parts=uniqueParts([city,district]);
 return parts.slice(0,2).join(" · ")||g.county||g.locality||admin.level4||g.country||"当前位置";
}
async function reverseLocation(lat,lon){
 const cached=safeCacheGet(LOCATION_CACHE_KEY);
 if(cached&&Date.now()-cached.ts<86400000&&Math.abs(cached.lat-lat)<0.03&&Math.abs(cached.lon-lon)<0.03)return cached.name;

 const url=`https://nominatim.openstreetmap.org/reverse?format=geocodejson&lat=${encodeURIComponent(lat)}&lon=${encodeURIComponent(lon)}&zoom=18&layer=address&addressdetails=1&accept-language=zh-CN`;
 const r=await fetch(url,{headers:{"Accept":"application/json"}});
 if(!r.ok)throw new Error("地址解析失败");
 const d=await r.json();
 const feature=Array.isArray(d.features)?d.features[0]:d.features;
 const geo=feature?.properties?.geocoding||{};
 const name=formatGeocodeLocation(geo);
 safeCacheSet(LOCATION_CACHE_KEY,{ts:Date.now(),lat,lon,name});
 return name;
}
function renderWeather(data){
 if(!data)return;
 currentWeatherData=data;
 const info=weatherInfo(data.code);
 $("weatherCard").dataset.state="ready";
 $("weatherIcon").textContent=info.icon;
 $("weatherLocation").textContent=data.location||"当前位置";
 $("weatherTemp").textContent=`${Math.round(data.temp)}°`;
 $("weatherText").textContent=info.text;
 $("weatherRange").textContent=(Number.isFinite(data.max)&&Number.isFinite(data.min))?`· ${Math.round(data.max)}°/${Math.round(data.min)}°`:"";
 if($("forecastBack").classList.contains("open"))renderForecast(data);
}
function renderWeatherError(message){
 $("weatherCard").dataset.state="error";
 $("weatherIcon").textContent="⌖";
 $("weatherLocation").textContent="天气定位";
 $("weatherTemp").textContent="";
 $("weatherText").textContent=message;
 $("weatherRange").textContent="";
}
function forecastDayLabel(date,index){
 const [y,m,d]=String(date||"").split("-").map(Number);
 const dt=new Date(y,m-1,d);
 const weekday=["周日","周一","周二","周三","周四","周五","周六"][dt.getDay()];
 return{week:index===0?"今天":index===1?"明天":weekday,date:`${m}月${d}日`};
}
function renderForecast(data){
 $("forecastPlace").textContent=data?.location||"当前位置";
 const list=Array.isArray(data?.forecast)?data.forecast:[];
 if(!list.length){
   $("forecastGrid").innerHTML='<div class="forecastLoading">正在获取未来天气…</div>';
   return;
 }
 $("forecastGrid").innerHTML=list.map((day,index)=>{
   const info=weatherInfo(day.code),label=forecastDayLabel(day.date,index);
   const rain=Number.isFinite(day.rain)?`降雨 ${Math.round(day.rain)}%`:"";
   return `<div class="forecastDay${index===0?" today":""}">
     <div class="forecastWeek">${label.week}</div>
     <div class="forecastDate">${label.date}</div>
     <div class="forecastWeatherIcon">${info.icon}</div>
     <div class="forecastWeatherText">${info.text}</div>
     <div class="forecastTemps">${Math.round(day.max)}° <span class="forecastLow">/ ${Math.round(day.min)}°</span></div>
     <div class="forecastRain">${rain}</div>
   </div>`;
 }).join("");
}
function openForecast(){
 $("forecastBack").classList.add("open");
 $("forecastBack").setAttribute("aria-hidden","false");
 document.body.style.overflow="hidden";
 const cache=currentWeatherData||safeCacheGet(WEATHER_CACHE_KEY);
 if(cache)renderForecast(cache);
 else $("forecastGrid").innerHTML='<div class="forecastLoading">正在获取未来天气…</div>';
 if(!cache?.forecast?.length)loadWeather(true);
}
function closeForecast(){
 $("forecastBack").classList.remove("open");
 $("forecastBack").setAttribute("aria-hidden","true");
 document.body.style.overflow="";
}
async function fetchWeather(lat,lon,location){
 const url=`https://api.open-meteo.com/v1/forecast?latitude=${encodeURIComponent(lat)}&longitude=${encodeURIComponent(lon)}&current=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=7`;
 const r=await fetch(url);
 if(!r.ok)throw new Error("天气获取失败");
 const d=await r.json();
 const dates=d.daily?.time||[];
 const forecast=dates.map((date,i)=>({
   date,
   code:Number(d.daily?.weather_code?.[i]),
   max:Number(d.daily?.temperature_2m_max?.[i]),
   min:Number(d.daily?.temperature_2m_min?.[i]),
   rain:Number(d.daily?.precipitation_probability_max?.[i])
 }));
 const data={
   ts:Date.now(),
   lat,lon,location,
   temp:Number(d.current?.temperature_2m),
   code:Number(d.current?.weather_code),
   max:Number(d.daily?.temperature_2m_max?.[0]),
   min:Number(d.daily?.temperature_2m_min?.[0]),
   forecast
 };
 safeCacheSet(WEATHER_CACHE_KEY,data);
 renderWeather(data);
 return data;
}
async function loadWeather(force=false){
 const cache=safeCacheGet(WEATHER_CACHE_KEY);
 if(!force&&cache&&Date.now()-cache.ts<15*60*1000&&Array.isArray(cache.forecast)&&cache.forecast.length){
   renderWeather(cache);
   return cache;
 }
 if(cache&&!force)renderWeather(cache);
 if(!navigator.geolocation){
   if(!cache)renderWeatherError("浏览器不支持定位");
   return cache;
 }
 return new Promise(resolve=>{
   navigator.geolocation.getCurrentPosition(async pos=>{
     const lat=pos.coords.latitude,lon=pos.coords.longitude;
     try{
       const location=await reverseLocation(lat,lon);
       const data=await fetchWeather(lat,lon,location);
       resolve(data);
     }catch(err){
       console.warn(err);
       if(!cache)renderWeatherError("天气暂时无法获取");
       resolve(cache);
     }
   },err=>{
     console.warn("Geolocation:",err);
     if(!cache){
       const text=err?.code===1?"请允许定位以显示天气":"无法获取当前位置";
       renderWeatherError(text);
     }
     resolve(cache);
   },{enableHighAccuracy:true,timeout:12000,maximumAge:10*60*1000});
 });
}
$("weatherCard").onclick=openForecast;
$("forecastClose").onclick=closeForecast;
$("forecastBack").onclick=e=>{if(e.target===$("forecastBack"))closeForecast()};
$("forecastRefresh").onclick=async()=>{
 $("forecastGrid").innerHTML='<div class="forecastLoading">正在重新定位并获取天气…</div>';
 try{localStorage.removeItem(LOCATION_CACHE_KEY)}catch{}
 await loadWeather(true);
};
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("forecastBack").classList.contains("open"))closeForecast()});

$("year").textContent=new Date().getFullYear();renderEngineSelect();applySettings();renderNav();clock();setInterval(clock,1000);loadConfig();loadWeather();
</script>
