<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f6f7fb">
<title>龙鲟导航</title>
<style>
:root{--bg:#f6f7fb;--panel:rgba(255,255,255,.84);--solid:#fff;--text:#18181b;--muted:#71717a;--line:rgba(24,24,27,.09);--chip:#f0f1f4;--shadow:0 16px 46px rgba(24,24,27,.08);--primary:#18181b;--primaryText:#fff;--engine-selected:#52525b;--engine-selected-text:#fff;--engine-unselected:#fff;--engine-hover:#f1f2f4}
html[data-theme=dark]{--bg:#0c0d10;--panel:rgba(24,24,27,.82);--solid:#18181b;--text:#f4f4f5;--muted:#a1a1aa;--line:rgba(255,255,255,.09);--chip:#27272a;--shadow:0 18px 46px rgba(0,0,0,.28);--primary:#f4f4f5;--primaryText:#18181b;--engine-selected:#52525b;--engine-selected-text:#fff;--engine-unselected:#fff;--engine-hover:#f1f2f4}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 0,rgba(96,165,250,.14),transparent 28rem),radial-gradient(circle at 90% 15%,rgba(167,139,250,.14),transparent 30rem),var(--bg);color:var(--text);font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;transition:.2s}
button,input,select{font:inherit}.shell{width:min(1180px,calc(100% - 32px));margin:auto;padding:28px 0 58px}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:52px}.brand{display:flex;align-items:center;gap:11px;font-size:18px;font-weight:850}.brandMark{width:39px;height:39px;border-radius:13px;display:grid;place-items:center;background:var(--primary);color:var(--primaryText);box-shadow:var(--shadow)}.actions{display:flex;gap:9px;align-items:center}.pill,.iconBtn{border:1px solid var(--line);background:var(--panel);color:var(--text);backdrop-filter:blur(18px)}.pill{padding:10px 13px;border-radius:999px;color:var(--muted);font-size:13px}.iconBtn{width:42px;height:42px;border-radius:50%;cursor:pointer}
.hero{text-align:center;max-width:830px;margin:0 auto 44px}.hero h1{font-size:clamp(38px,6vw,64px);letter-spacing:-.055em;line-height:1.04;margin:0 0 12px}.hero p{margin:0 0 25px;color:var(--muted)}
.search{max-width:760px;margin:auto;display:flex;align-items:center;padding:7px;border:1px solid var(--line);background:var(--solid);border-radius:24px;box-shadow:0 20px 62px rgba(0,0,0,.09)}.search:focus-within{box-shadow:0 24px 72px rgba(0,0,0,.13)}
.enginePicker{position:relative;flex:0 0 auto;margin-left:1px}.engineTrigger{width:52px;height:52px;border:0;outline:0;border-radius:16px;background:#fff;color:#18181b;display:flex;align-items:center;justify-content:center;gap:4px;cursor:pointer;transition:background .16s,transform .16s,box-shadow .16s}.engineTrigger:hover{background:var(--engine-hover)}.engineTrigger:active{transform:scale(.97)}.engineTrigger[aria-expanded="true"]{box-shadow:0 0 0 3px rgba(120,120,130,.10)}.engineLogo{width:28px;height:28px;border-radius:50%;background:#fff;display:grid;place-items:center;overflow:hidden;flex:0 0 28px;box-shadow:0 1px 3px rgba(0,0,0,.10)}.engineLogo img{width:19px;height:19px;object-fit:contain}.engineLogo .fallback{display:none;font-size:11px;font-weight:900;color:#71717a}.engineCaret{font-size:10px;color:var(--muted);line-height:1;transform:translateY(-1px);transition:transform .16s}.engineTrigger[aria-expanded="true"] .engineCaret{transform:translateY(-1px) rotate(180deg)}.engineMenu{position:absolute;left:0;top:calc(100% + 10px);z-index:50;width:220px;padding:7px;background:#fff;border:1px solid #e5e7eb;border-radius:16px;box-shadow:0 18px 55px rgba(0,0,0,.16);opacity:0;visibility:hidden;transform:translateY(-6px) scale(.98);transform-origin:top left;transition:opacity .14s,visibility .14s,transform .14s}.engineMenu.open{opacity:1;visibility:visible;transform:translateY(0) scale(1)}.engineOption{width:100%;border:0;background:#fff!important;margin:3px 0;color:#18181b!important;display:flex;align-items:center;gap:11px;padding:10px 11px;border-radius:11px;text-align:left;cursor:pointer;transition:background .12s}.engineOption:hover{background:var(--engine-hover)!important}.engineOption.active{background:var(--engine-selected)!important;color:var(--engine-selected-text)!important;font-weight:800}.engineOptionLogo{width:27px;height:27px;flex:0 0 27px;border-radius:50%;background:#fff;display:grid;place-items:center;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.08)}.engineOptionLogo img{width:18px;height:18px;object-fit:contain}.engineOptionFallback{font-size:11px;font-weight:900;color:#71717a}.engineOptionName{min-width:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}.engineCheck{width:18px;color:var(--muted);font-size:13px;text-align:center}.engineOption.active .engineCheck{color:var(--engine-selected-text)!important}.searchDivider{width:1px;height:28px;background:var(--line);margin:0 6px 0 10px;flex:0 0 1px}
.search input{width:100%;min-width:0;padding:13px 12px;border:0;outline:0;background:transparent;color:var(--text);font-size:16px}.search button{border:0;border-radius:18px;background:var(--primary);color:var(--primaryText);padding:13px 20px;font-weight:800;cursor:pointer}
.toolbar{display:flex;align-items:end;justify-content:space-between;gap:16px;margin:0 0 18px}.toolbar h2{margin:0 0 5px;font-size:22px}.toolbar p{margin:0;color:var(--muted);font-size:13px}.filter{width:280px;max-width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:13px;background:var(--panel);color:var(--text);outline:none}
.category{margin-top:28px}.catHead{display:flex;align-items:center;gap:9px;margin-bottom:13px}.dot{width:8px;height:8px;border-radius:50%;background:var(--text);opacity:.72}.catName{font-size:14px;font-weight:850}.count{font-size:12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.siteBtn{position:relative;min-height:126px;padding:17px 10px 14px;border:1px solid var(--line);border-radius:18px;background:var(--panel);backdrop-filter:blur(18px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;text-decoration:none;color:var(--text);transition:.18s;overflow:hidden}.siteBtn:hover{transform:translateY(-4px);box-shadow:var(--shadow);border-color:rgba(110,110,120,.22)}.siteBtn:active{transform:translateY(-1px)}
.logoBox{width:50px;height:50px;border-radius:15px;background:var(--chip);display:grid;place-items:center;margin-bottom:10px;overflow:hidden}.logoBox img{width:31px;height:31px;object-fit:contain}.logoFallback{display:none;font-weight:900;font-size:15px}.siteName{width:100%;font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.siteDesc{width:100%;font-size:10px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status{display:none;text-align:center;padding:50px 20px;border:1px dashed var(--line);border-radius:18px;color:var(--muted)}.kvWarn{display:none;max-width:760px;margin:16px auto 0;padding:10px 12px;border:1px solid var(--line);border-radius:12px;color:var(--muted);font-size:12px}
footer{text-align:center;margin-top:48px;color:var(--muted);font-size:12px}
@media(max-width:1000px){.grid{grid-template-columns:repeat(5,minmax(0,1fr))}}@media(max-width:820px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(max-width:650px){.shell{width:calc(100% - 22px);padding-top:18px}.pill{display:none}.topbar{margin-bottom:40px}.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.toolbar{align-items:stretch;flex-direction:column}.filter{width:100%}.siteBtn{min-height:116px}.hero{margin-bottom:36px}.engineTrigger{width:48px;height:48px;border-radius:14px}.engineLogo{width:26px;height:26px;flex-basis:26px}.engineMenu{width:205px}.search input{padding-left:8px}.search button{padding-left:15px;padding-right:15px}}@media(max-width:430px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hero h1{font-size:42px}.engineTrigger{width:46px;height:46px}.engineMenu{width:195px}}
</style>
</head>
<body>
<main class="shell">
<header class="topbar">
  <div class="brand"><div class="brandMark">D</div><span id="brandText">龙鲟导航</span></div>
  <div class="actions"><div class="pill" id="clock">--:--</div><button class="iconBtn" id="themeBtn" aria-label="切换主题">◐</button></div>
</header>
<section class="hero">
  <h1 id="heroTitle">龙鲟导航</h1>
  <p id="heroSubtitle">搜索一下，或者直接打开常用网站</p>
  <form class="search" id="searchForm">
    <div class="enginePicker" id="enginePicker">
      <button class="engineTrigger" id="engineTrigger" type="button" aria-label="选择搜索引擎" aria-haspopup="menu" aria-expanded="false">
        <span class="engineLogo" aria-hidden="true"><img id="engineLogoImg" alt="" loading="lazy"><span class="fallback" id="engineLogoFallback"></span></span>
        <span class="engineCaret" aria-hidden="true">⌄</span>
      </button>
      <div class="engineMenu" id="engineMenu" role="menu"></div>
    </div>
    <span class="searchDivider"></span>
    <input id="searchInput" autocomplete="off" placeholder="搜索内容，或输入网址直接打开…">
    <button>搜索</button>
  </form>
  <div class="kvWarn" id="kvWarn">暂时无法读取 KV，当前显示内置默认导航。</div>
</section>
<section>
  <div class="toolbar"><div><h2>网站导航</h2><p>图标按钮形式，点击后在新标签页打开</p></div><input class="filter" id="filter" placeholder="筛选网站…"></div>
  <div id="navRoot"></div><div class="status" id="empty">没有找到匹配的网站</div>
</section>
<footer>© <span id="year"></span> <span id="footerTitle">龙鲟导航</span> · Tencent EdgeOne Makers</footer>
</main>
<script>
const DEFAULT_CONFIG={"version":3,"settings":{"title":"龙鲟导航","subtitle":"搜索一下，或者直接打开常用网站","maxSites":0,"engineColorFollowTheme":false,"engineSelectedColor":"#52525b","engineUnselectedColor":"#ffffff","engineHoverColor":"#f1f2f4"},"categories":[{"id":"ai","name":"AI 工具","enabled":true},{"id":"dev","name":"开发与代码","enabled":true},{"id":"cloud","name":"云服务与部署","enabled":true},{"id":"office","name":"日常办公","enabled":true},{"id":"media","name":"影音与社区","enabled":true},{"id":"tools","name":"实用工具","enabled":true}],"sites":[{"id":"chatgpt","name":"ChatGPT","url":"https://chatgpt.com/","desc":"OpenAI AI 助手","icon":"","categoryId":"ai","enabled":true},{"id":"deepseek","name":"DeepSeek","url":"https://chat.deepseek.com/","desc":"DeepSeek AI 助手","icon":"","categoryId":"ai","enabled":true},{"id":"yuanbao","name":"腾讯元宝","url":"https://yuanbao.tencent.com/","desc":"腾讯 AI 助手","icon":"","categoryId":"ai","enabled":true},{"id":"gemini","name":"Gemini","url":"https://gemini.google.com/","desc":"Google AI 助手","icon":"","categoryId":"ai","enabled":true},{"id":"github","name":"GitHub","url":"https://github.com/","desc":"代码托管与协作","icon":"","categoryId":"dev","enabled":true},{"id":"gitee","name":"Gitee","url":"https://gitee.com/","desc":"国内代码托管平台","icon":"","categoryId":"dev","enabled":true},{"id":"mdn","name":"MDN","url":"https://developer.mozilla.org/zh-CN/","desc":"Web 开发文档","icon":"","categoryId":"dev","enabled":true},{"id":"stackoverflow","name":"Stack Overflow","url":"https://stackoverflow.com/","desc":"开发者问答社区","icon":"","categoryId":"dev","enabled":true},{"id":"edgeone","name":"EdgeOne Makers","url":"https://pages.edgeone.ai/","desc":"Tencent EdgeOne 部署平台","icon":"","categoryId":"cloud","enabled":true},{"id":"tencentcloud","name":"腾讯云","url":"https://cloud.tencent.com/","desc":"腾讯云控制台与服务","icon":"","categoryId":"cloud","enabled":true},{"id":"cloudflare","name":"Cloudflare","url":"https://dash.cloudflare.com/","desc":"CDN、DNS 与网络服务","icon":"","categoryId":"cloud","enabled":true},{"id":"vercel","name":"Vercel","url":"https://vercel.com/","desc":"前端应用部署平台","icon":"","categoryId":"cloud","enabled":true},{"id":"docsqq","name":"腾讯文档","url":"https://docs.qq.com/","desc":"在线文档与表格","icon":"","categoryId":"office","enabled":true},{"id":"feishu","name":"飞书","url":"https://www.feishu.cn/","desc":"协同办公平台","icon":"","categoryId":"office","enabled":true},{"id":"wps","name":"WPS","url":"https://www.wps.cn/","desc":"办公软件与云文档","icon":"","categoryId":"office","enabled":true},{"id":"notion","name":"Notion","url":"https://www.notion.so/","desc":"知识库与笔记","icon":"","categoryId":"office","enabled":true},{"id":"bilibili","name":"哔哩哔哩","url":"https://www.bilibili.com/","desc":"视频与社区","icon":"","categoryId":"media","enabled":true},{"id":"youtube","name":"YouTube","url":"https://www.youtube.com/","desc":"在线视频平台","icon":"","categoryId":"media","enabled":true},{"id":"zhihu","name":"知乎","url":"https://www.zhihu.com/","desc":"中文问答社区","icon":"","categoryId":"media","enabled":true},{"id":"weibo","name":"微博","url":"https://weibo.com/","desc":"社交媒体平台","icon":"","categoryId":"media","enabled":true},{"id":"speedtest","name":"Speedtest","url":"https://www.speedtest.net/","desc":"网络速度测试","icon":"","categoryId":"tools","enabled":true},{"id":"ipsb","name":"IP 查询","url":"https://ip.sb/","desc":"查看当前公网 IP","icon":"","categoryId":"tools","enabled":true},{"id":"caniuse","name":"Can I Use","url":"https://caniuse.com/","desc":"浏览器兼容性查询","icon":"","categoryId":"tools","enabled":true},{"id":"tinypng","name":"TinyPNG","url":"https://tinypng.com/","desc":"在线图片压缩","icon":"","categoryId":"tools","enabled":true}],"searchEngines":[{"id":"bing","name":"必应","url":"https://www.bing.com/search?q={q}","icon":"https://www.bing.com/favicon.ico","enabled":true},{"id":"baidu","name":"百度","url":"https://www.baidu.com/s?wd={q}","icon":"https://www.baidu.com/favicon.ico","enabled":true},{"id":"google","name":"Google","url":"https://www.google.com/search?q={q}","icon":"https://www.google.com/favicon.ico","enabled":true},{"id":"sogou","name":"搜狗","url":"https://www.sogou.com/web?query={q}","icon":"https://www.sogou.com/favicon.ico","enabled":true},{"id":"duck","name":"DuckDuckGo","url":"https://duckduckgo.com/?q={q}","icon":"https://duckduckgo.com/favicon.ico","enabled":true}]};
let config=structuredClone(DEFAULT_CONFIG);
let engine=localStorage.getItem("nav-engine")||"";
const $=id=>document.getElementById(id);
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function safeUrl(url){try{const u=new URL(url);return ["http:","https:"].includes(u.protocol)?u.href:"#"}catch{return"#"}}
function favicon(site){if(site.icon&&/^https?:\/\//i.test(site.icon))return site.icon;try{return new URL("/favicon.ico",site.url).href}catch{return""}}
function initials(name){return(name||"?").replace(/\s+/g,"").slice(0,2).toUpperCase()}
function activeEngines(){return(config.searchEngines||[]).filter(e=>e.enabled!==false&&e.url)}
function engineIcon(item){if(item?.icon&&/^https?:\/\//i.test(item.icon))return item.icon;try{return new URL("/favicon.ico",item?.url||"").href}catch{return""}}
function setEngineLogo(item){
 const img=$("engineLogoImg"),fallback=$("engineLogoFallback"),icon=engineIcon(item);
 fallback.textContent=(item?.name||"?").trim().slice(0,1).toUpperCase()||"?";
 if(icon){img.src=icon;img.style.display="block";fallback.style.display="none";img.onerror=()=>{img.style.display="none";fallback.style.display="block"}}
 else{img.removeAttribute("src");img.style.display="none";fallback.style.display="block"}
}
function engineOptionHtml(item,isActive){
 const icon=engineIcon(item),fallback=(item?.name||"?").trim().slice(0,1).toUpperCase()||"?";
 return `<button class="engineOption${isActive?" active":""}" type="button" role="menuitem" data-engine-id="${esc(item.id)}">
   <span class="engineOptionLogo">${icon?`<img src="${esc(icon)}" alt="" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='block'">`:""}<span class="engineOptionFallback" style="${icon?"display:none":""}">${esc(fallback)}</span></span>
   <span class="engineOptionName">${esc(item.name)}</span>
   <span class="engineCheck">${isActive?"✓":""}</span>
 </button>`;
}
function closeEngineMenu(){
 $("engineMenu").classList.remove("open");
 $("engineTrigger").setAttribute("aria-expanded","false");
}
function openEngineMenu(){
 $("engineMenu").classList.add("open");
 $("engineTrigger").setAttribute("aria-expanded","true");
}
function toggleEngineMenu(){
 $("engineMenu").classList.contains("open")?closeEngineMenu():openEngineMenu();
}
function renderEngineSelect(){
 const engines=activeEngines(),menu=$("engineMenu");
 if(!engines.length){engine="";setEngineLogo(null);menu.innerHTML='<div style="padding:11px;color:var(--muted);font-size:13px">暂无可用搜索引擎</div>';return}
 if(!engines.some(e=>e.id===engine))engine=engines[0].id;
 const current=engines.find(e=>e.id===engine)||engines[0];
 setEngineLogo(current);
 menu.innerHTML=engines.map(e=>engineOptionHtml(e,e.id===engine)).join("");
 menu.querySelectorAll("[data-engine-id]").forEach(btn=>btn.onclick=()=>{
   engine=btn.dataset.engineId;
   localStorage.setItem("nav-engine",engine);
   renderEngineSelect();
   closeEngineMenu();
   $("searchInput").focus();
 });
 localStorage.setItem("nav-engine",engine);
}
$("engineTrigger").onclick=e=>{e.stopPropagation();toggleEngineMenu()};
$("engineMenu").onclick=e=>e.stopPropagation();
document.addEventListener("click",closeEngineMenu);
document.addEventListener("keydown",e=>{
 if(e.key==="Escape")closeEngineMenu();
});
function buildSearchUrl(item,q){
 const encoded=encodeURIComponent(q),tpl=String(item?.url||"");
 return tpl.includes("{q}")?tpl.split("{q}").join(encoded):tpl+encoded;
}
$("searchForm").onsubmit=e=>{
 e.preventDefault();const q=$("searchInput").value.trim();if(!q)return;
 const looks=/^(https?:\/\/)/i.test(q)||/^([a-z0-9-]+\.)+[a-z]{2,}(\/.*)?$/i.test(q)||/^localhost(:\d+)?/i.test(q);
 if(looks){window.open(/^https?:\/\//i.test(q)?q:"https://"+q,"_blank","noopener,noreferrer");return}
 const engines=activeEngines(),se=engines.find(x=>x.id===engine)||engines[0];if(!se)return;
 window.open(buildSearchUrl(se,q),"_blank","noopener,noreferrer");
};
function visibleData(keyword=""){
 const cats=(config.categories||[]).filter(x=>x.enabled!==false);
 const activeSites=(config.sites||[]).filter(x=>x.enabled!==false);
 let ordered=[];cats.forEach(cat=>{activeSites.filter(s=>s.categoryId===cat.id).forEach(s=>ordered.push(s))});
 const max=Number(config.settings?.maxSites||0);if(max>0)ordered=ordered.slice(0,max);
 const k=keyword.trim().toLowerCase();
 if(k)ordered=ordered.filter(s=>(`${s.name} ${s.desc||""} ${cats.find(c=>c.id===s.categoryId)?.name||""}`).toLowerCase().includes(k));
 return{cats,sites:ordered};
}
function renderNav(keyword=""){
 const{cats,sites}=visibleData(keyword),root=$("navRoot");root.innerHTML="";let shown=0;
 cats.forEach(cat=>{
   const list=sites.filter(s=>s.categoryId===cat.id);if(!list.length)return;shown+=list.length;
   const sec=document.createElement("div");sec.className="category";
   sec.innerHTML=`<div class="catHead"><span class="dot"></span><span class="catName">${esc(cat.name)}</span><span class="count">${list.length}</span></div><div class="grid"></div>`;
   const grid=sec.querySelector(".grid");
   list.forEach(site=>{
     const a=document.createElement("a");a.className="siteBtn";a.href=safeUrl(site.url);a.target="_blank";a.rel="noopener noreferrer";const icon=favicon(site);
     a.innerHTML=`<div class="logoBox">${icon?`<img src="${esc(icon)}" alt="" loading="lazy">`:""}<span class="logoFallback" style="${icon?"":"display:block"}">${esc(initials(site.name))}</span></div><div class="siteName">${esc(site.name)}</div><div class="siteDesc">${esc(site.desc||"点击打开")}</div>`;
     const img=a.querySelector("img");if(img)img.onerror=()=>{img.style.display="none";a.querySelector(".logoFallback").style.display="block"};grid.appendChild(a);
   });root.appendChild(sec);
 });$("empty").style.display=shown?"none":"block";
}
function applySettings(){
 const s=config.settings||{},title=s.title||"龙鲟导航";
 document.title=title;$("brandText").textContent=title;$("heroTitle").textContent=title;$("footerTitle").textContent=title;$("heroSubtitle").textContent=s.subtitle||"搜索一下，或者直接打开常用网站";
 const validHex=v=>/^#[0-9a-fA-F]{6}$/.test(String(v||""));
 const selected=validHex(s.engineSelectedColor)?s.engineSelectedColor:"#52525b";
 const hover=validHex(s.engineHoverColor)?s.engineHoverColor:"#f1f2f4";
 document.documentElement.style.setProperty("--engine-selected",selected);
 document.documentElement.style.setProperty("--engine-unselected","#ffffff");
 document.documentElement.style.setProperty("--engine-hover",hover);
}
async function loadConfig(){try{const r=await fetch("/api/config",{cache:"no-store"});if(!r.ok)throw new Error("HTTP "+r.status);const data=await r.json();if(data?.config)config=data.config}catch(err){console.warn(err);$("kvWarn").style.display="block"}applySettings();renderEngineSelect();renderNav($("filter").value)}
$("filter").oninput=e=>renderNav(e.target.value);
document.addEventListener("keydown",e=>{if(e.key==="/"&&document.activeElement.tagName!=="INPUT"){e.preventDefault();$("searchInput").focus()}});
const saved=localStorage.getItem("nav-theme");document.documentElement.dataset.theme=saved||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
function themeBtn(){$("themeBtn").textContent=document.documentElement.dataset.theme==="dark"?"☀":"◐"}
$("themeBtn").onclick=()=>{const n=document.documentElement.dataset.theme==="dark"?"light":"dark";document.documentElement.dataset.theme=n;localStorage.setItem("nav-theme",n);themeBtn()};
function clock(){const n=new Date();$("clock").textContent=n.toLocaleDateString("zh-CN",{month:"short",day:"numeric",weekday:"short"})+" · "+n.toLocaleTimeString("zh-CN",{hour:"2-digit",minute:"2-digit",hour12:false})}
$("year").textContent=new Date().getFullYear();renderEngineSelect();applySettings();renderNav();themeBtn();clock();setInterval(clock,30000);loadConfig();
</script>
</body>
</html>
