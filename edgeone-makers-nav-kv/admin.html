<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>导航后台管理</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#18181b;font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif}
button,input,select,textarea{font:inherit}.wrap{width:min(1180px,calc(100% - 28px));margin:28px auto 60px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px}.top h1{font-size:27px;margin:0}.sub{color:#71717a;font-size:13px;margin-top:5px}.card{background:#fff;border:1px solid #e7e7eb;border-radius:18px;padding:18px;box-shadow:0 10px 32px rgba(0,0,0,.04);margin-bottom:16px}
.login{width:min(430px,calc(100% - 24px));margin:10vh auto}.row{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px}.field{grid-column:span 6}.field.full{grid-column:1/-1}.field label{display:block;font-size:12px;color:#71717a;margin:0 0 6px}.field input,.field select,.field textarea{width:100%;border:1px solid #dddde3;border-radius:11px;padding:10px 12px;background:#fff;outline:none}.field textarea{min-height:80px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:#71717a}
.btn{border:0;border-radius:11px;padding:10px 14px;cursor:pointer;font-weight:750}.primary{background:#18181b;color:#fff}.light{background:#f0f1f4;color:#18181b}.danger{background:#fff0f0;color:#c62828}.small{padding:7px 10px;font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.sectionHead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:13px}.sectionHead h2{font-size:17px;margin:0}.badge{font-size:12px;color:#71717a}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:11px 9px;border-bottom:1px solid #eee;vertical-align:middle}th{font-size:12px;color:#71717a;font-weight:700}.tableWrap{overflow:auto}.switch{display:flex;align-items:center;gap:7px}.switch input{width:17px;height:17px}.iconPreview{width:32px;height:32px;object-fit:contain;border-radius:8px;background:#f1f2f4;padding:4px}
.notice{display:none;padding:10px 12px;border-radius:11px;margin-bottom:14px;font-size:13px}.ok{background:#ecfdf3;color:#18794e}.err{background:#fff1f1;color:#b42318}.muted{color:#71717a;font-size:12px}.hidden{display:none!important}
.modalBack{position:fixed;inset:0;background:rgba(0,0,0,.38);display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.modal{width:min(620px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:18px;padding:20px}.modal h3{margin:0 0 16px}
@media(max-width:720px){.field{grid-column:1/-1}.top{align-items:flex-start;flex-direction:column}.card{padding:14px}th,td{white-space:nowrap}}
</style>
</head>
<body>
<div id="loginView" class="login card">
 <h1 style="margin:0 0 6px">导航后台</h1><div class="sub" style="margin-bottom:18px">账号密码从 EdgeOne Makers 环境变量读取</div>
 <div id="loginNotice" class="notice"></div>
 <div class="field full"><label>管理员账号</label><input id="username" autocomplete="username"></div>
 <div class="field full" style="margin-top:12px"><label>管理员密码</label><input id="password" type="password" autocomplete="current-password"></div>
 <button id="loginBtn" class="btn primary" style="width:100%;margin-top:16px">登录</button>
</div>

<div id="appView" class="wrap hidden">
 <div class="top"><div><h1>导航后台管理</h1><div class="sub">控制首页网站数量、分类、顺序、启用状态和图标</div></div><div class="actions"><a href="/" target="_blank"><button class="btn light">打开前台</button></a><button id="logoutBtn" class="btn light">退出</button><button id="saveBtn" class="btn primary">保存到 KV</button></div></div>
 <div id="notice" class="notice"></div>

 <section class="card">
  <div class="sectionHead"><h2>首页设置</h2><span class="badge">0 = 全部显示</span></div>
  <div class="row">
   <div class="field"><label>网站标题</label><input id="title"></div>
   <div class="field"><label>首页最多显示网站数</label><input id="maxSites" type="number" min="0" step="1"></div>
   <div class="field full"><label>副标题</label><input id="subtitle"></div>
  </div>
 </section>

 <section class="card">
  <div class="sectionHead"><h2>分类管理</h2><button id="addCategoryBtn" class="btn light small">+ 新增分类</button></div>
  <div class="tableWrap"><table><thead><tr><th>分类名称</th><th>排序</th><th>启用</th><th>操作</th></tr></thead><tbody id="categoryBody"></tbody></table></div>
 </section>

 <section class="card">
  <div class="sectionHead"><h2>网站管理</h2><div><span class="badge" id="siteCount"></span> <button id="addSiteBtn" class="btn primary small">+ 新增网站</button></div></div>
  <div class="tableWrap"><table><thead><tr><th>图标</th><th>名称</th><th>分类</th><th>排序</th><th>启用</th><th>操作</th></tr></thead><tbody id="siteBody"></tbody></table></div>
 </section>
</div>

<div class="modalBack" id="siteModal"><div class="modal">
 <h3 id="siteModalTitle">新增网站</h3>
 <div class="row">
  <div class="field"><label>网站名称</label><input id="siteName"></div>
  <div class="field"><label>分类</label><select id="siteCategory"></select></div>
  <div class="field full"><label>网站地址</label><input id="siteUrl" placeholder="https://example.com/"></div>
  <div class="field full"><label>图标 URL（可留空）</label><input id="siteIcon" placeholder="留空则自动尝试 网站域名/favicon.ico"></div>
  <div class="field full"><label>说明</label><input id="siteDesc"></div>
  <div class="field"><label>排序</label><input id="siteSort" type="number" value="10"></div>
  <div class="field"><label>启用</label><select id="siteEnabled"><option value="true">启用</option><option value="false">停用</option></select></div>
 </div>
 <div class="actions" style="justify-content:flex-end;margin-top:18px"><button id="cancelSiteBtn" class="btn light">取消</button><button id="confirmSiteBtn" class="btn primary">确定</button></div>
</div></div>

<script>
let token=sessionStorage.getItem("nav-admin-token")||"";
let config=null;let editingSiteId=null;
const $=id=>document.getElementById(id);
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function uid(prefix){return prefix+"_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,7)}
function msg(text,ok=true,id="notice"){const n=$(id);n.textContent=text;n.className="notice "+(ok?"ok":"err");n.style.display="block";setTimeout(()=>n.style.display="none",3500)}
function authHeaders(){return {"Authorization":"Bearer "+token,"Content-Type":"application/json"}}
function favicon(s){if(s.icon&&/^https?:\/\//i.test(s.icon))return s.icon;try{return new URL("/favicon.ico",s.url).href}catch{return ""}}

async function login(){
 const username=$("username").value.trim(),password=$("password").value;
 try{
  const r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username,password})});
  const d=await r.json();if(!r.ok)throw new Error(d.error||"登录失败");
  token=d.token;sessionStorage.setItem("nav-admin-token",token);await boot();
 }catch(e){msg(e.message,false,"loginNotice")}
}
$("loginBtn").onclick=login;$("password").addEventListener("keydown",e=>{if(e.key==="Enter")login()});

async function boot(){
 if(!token)return;
 try{
  const r=await fetch("/api/config?admin=1",{headers:authHeaders(),cache:"no-store"});const d=await r.json();
  if(!r.ok)throw new Error(d.error||"登录状态失效");
  config=d.config;$("loginView").classList.add("hidden");$("appView").classList.remove("hidden");render();
 }catch(e){sessionStorage.removeItem("nav-admin-token");token="";$("appView").classList.add("hidden");$("loginView").classList.remove("hidden");msg(e.message,false,"loginNotice")}
}

function render(){
 $("title").value=config.settings?.title||"";$("subtitle").value=config.settings?.subtitle||"";$("maxSites").value=Number(config.settings?.maxSites||0);
 renderCategories();renderSites();
}
function syncSettings(){config.settings=config.settings||{};config.settings.title=$("title").value.trim()||"导航";config.settings.subtitle=$("subtitle").value.trim();config.settings.maxSites=Math.max(0,Number($("maxSites").value||0)|0)}

function renderCategories(){
 const body=$("categoryBody");body.innerHTML="";
 [...config.categories].sort((a,b)=>(a.sort||0)-(b.sort||0)).forEach(c=>{
  const tr=document.createElement("tr");
  tr.innerHTML=`<td><input data-cat-name="${esc(c.id)}" value="${esc(c.name)}" style="width:150px;padding:7px;border:1px solid #ddd;border-radius:8px"></td>
  <td><input data-cat-sort="${esc(c.id)}" type="number" value="${Number(c.sort||0)}" style="width:76px;padding:7px;border:1px solid #ddd;border-radius:8px"></td>
  <td><label class="switch"><input data-cat-enabled="${esc(c.id)}" type="checkbox" ${c.enabled!==false?"checked":""}>启用</label></td>
  <td><button class="btn danger small" data-del-cat="${esc(c.id)}">删除</button></td>`;
  body.appendChild(tr);
 });
 body.querySelectorAll("[data-del-cat]").forEach(b=>b.onclick=()=>deleteCategory(b.dataset.delCat));
}
function syncCategories(){
 config.categories.forEach(c=>{
   const n=document.querySelector(`[data-cat-name="${CSS.escape(c.id)}"]`),s=document.querySelector(`[data-cat-sort="${CSS.escape(c.id)}"]`),e=document.querySelector(`[data-cat-enabled="${CSS.escape(c.id)}"]`);
   if(n)c.name=n.value.trim()||"未命名分类";if(s)c.sort=Number(s.value||0);if(e)c.enabled=e.checked;
 });
}
function deleteCategory(id){
 if(config.sites.some(s=>s.categoryId===id)){alert("该分类下还有网站，请先移动或删除这些网站。");return}
 config.categories=config.categories.filter(c=>c.id!==id);renderCategories();
}
$("addCategoryBtn").onclick=()=>{syncCategories();config.categories.push({id:uid("cat"),name:"新分类",sort:(config.categories.length+1)*10,enabled:true});renderCategories()};

function renderSites(){
 syncCategories();
 const cats=new Map(config.categories.map(c=>[c.id,c.name]));
 const body=$("siteBody");body.innerHTML="";
 [...config.sites].sort((a,b)=>(a.sort||0)-(b.sort||0)).forEach(s=>{
  const tr=document.createElement("tr");const ico=favicon(s);
  tr.innerHTML=`<td>${ico?`<img class="iconPreview" src="${esc(ico)}" onerror="this.style.visibility='hidden'">`:"—"}</td><td><b>${esc(s.name)}</b><div class="muted">${esc(s.url)}</div></td><td>${esc(cats.get(s.categoryId)||"未分类")}</td><td>${Number(s.sort||0)}</td><td>${s.enabled!==false?"启用":"停用"}</td><td><div class="actions"><button class="btn light small" data-edit="${esc(s.id)}">编辑</button><button class="btn danger small" data-del="${esc(s.id)}">删除</button></div></td>`;
  body.appendChild(tr);
 });
 $("siteCount").textContent=`共 ${config.sites.length} 个`;
 body.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>openSite(b.dataset.edit));
 body.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{if(confirm("确定删除这个网站？")){config.sites=config.sites.filter(s=>s.id!==b.dataset.del);renderSites()}});
}
function fillCategorySelect(){
 syncCategories();$("siteCategory").innerHTML=config.categories.filter(c=>c.enabled!==false).sort((a,b)=>(a.sort||0)-(b.sort||0)).map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join("");
}
function openSite(id=null){
 fillCategorySelect();editingSiteId=id;const s=id?config.sites.find(x=>x.id===id):null;$("siteModalTitle").textContent=s?"编辑网站":"新增网站";
 $("siteName").value=s?.name||"";$("siteUrl").value=s?.url||"";$("siteIcon").value=s?.icon||"";$("siteDesc").value=s?.desc||"";$("siteSort").value=Number(s?.sort??((config.sites.length+1)*10));$("siteEnabled").value=(s?.enabled!==false).toString();
 if(s)$("siteCategory").value=s.categoryId;$("siteModal").style.display="flex";
}
$("addSiteBtn").onclick=()=>openSite();$("cancelSiteBtn").onclick=()=>$("siteModal").style.display="none";
$("siteModal").onclick=e=>{if(e.target===$("siteModal"))$("siteModal").style.display="none"};
$("confirmSiteBtn").onclick=()=>{
 const name=$("siteName").value.trim(),url=$("siteUrl").value.trim(),categoryId=$("siteCategory").value;if(!name||!url||!categoryId){alert("网站名称、地址和分类不能为空。");return}
 try{const u=new URL(url);if(!["http:","https:"].includes(u.protocol))throw new Error()}catch{alert("网站地址必须是 http:// 或 https:// 开头的有效网址。");return}
 const data={name,url,icon:$("siteIcon").value.trim(),desc:$("siteDesc").value.trim(),categoryId,sort:Number($("siteSort").value||0),enabled:$("siteEnabled").value==="true"};
 if(editingSiteId){Object.assign(config.sites.find(x=>x.id===editingSiteId),data)}else{config.sites.push({id:uid("site"),...data})}
 $("siteModal").style.display="none";renderSites();
};

$("saveBtn").onclick=async()=>{
 syncSettings();syncCategories();
 try{
  const r=await fetch("/api/config",{method:"POST",headers:authHeaders(),body:JSON.stringify({config})});const d=await r.json();if(!r.ok)throw new Error(d.error||"保存失败");config=d.config;render();msg("已保存到 EdgeOne KV。其他边缘节点最长约 60 秒同步。");
 }catch(e){msg(e.message,false)}
};
$("logoutBtn").onclick=()=>{sessionStorage.removeItem("nav-admin-token");location.reload()};
boot();
</script>
</body>
</html>
